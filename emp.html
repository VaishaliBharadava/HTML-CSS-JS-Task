<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Table</title>
    <link rel="stylesheet" href="emp.css">
</head>
<body>
    <h2>Employee Table</h2>
    <!-- Department Filter -->
    <label for="sortDepartment">Filter by Department:</label>
    <select id="sortDepartment" onchange="renderTable()"></select>
    <!-- Search Filter -->
    <label for="searchInput">Search by Name:</label>
    <input type="text" id="searchInput" oninput="renderTable()" />
    <!-- Sort Filter -->
    <label for="sortSelect">Sort by Salary:</label>
    <select id="sortSelect" onchange="renderTable()">
        <option value="">None</option>
        <option value="Ascending">Ascending</option>
        <option value="Descending">Descending</option>
    </select>
    <!-- Table -->
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Salary</th>
                <th>Department</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="employeeTableBody"></tbody>
    </table>
    <!-- Link to JavaScript file -->
    <script src="emp.js"></script>
</body>
</html>
